name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk TV-Remote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TV-Remote
          path: TV-Remote.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TV Remote (latest build)
          make_latest: true
          files: TV-Remote.apk
          body: |
            Open this page on the Galaxy Tab and tap **TV-Remote.apk** to download, then open it to install.
            Build ${{ github.run_number }}.
